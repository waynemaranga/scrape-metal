[project]
name = "scrape-metal"
version = "0.1.0"
description = "Scrape Dlubal steel cross-section properties (metric) into polars/JSON, served by FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pendulum>=3.2.0",
    "polars>=1.44.2",
    "selenium>=4.49.0",
    "sqlmodel>=0.0.47",
]
